[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ukmoney-rag"
version = "0.1.0"
description = "Ingestion and retrieval pipeline over GOV.UK money guidance."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.13",
    "fastapi>=0.115",
    "fastembed>=0.8.1,<0.9",
    "httpx>=0.27",
    "numpy>=2,<3",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
ukmoney-ingest = "ukmoney_rag.ingest:main"
ukmoney-serve = "ukmoney_rag.api:main"
ukmoney-build-index = "ukmoney_rag.dense:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ukmoney_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

# fastembed is not clean under --strict; contained to one import in embed.py.
[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # lets tests import tests/fakes.py
addopts = "-ra --strict-markers -m 'not network and not model'"
markers = [
    "network: hits the live internet (run with: pytest -m network)",
    "model: downloads/runs the real embedding model (run with: pytest -m model)",
]
# Upstream deprecation inside fastapi.testclient (not our code); remove once FastAPI updates.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:Warning"]

[tool.coverage.run]
source = ["ukmoney_rag"]
branch = true
