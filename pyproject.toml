[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ukmoney-rag"
version = "0.1.0"
description = "Grounded Q&A over GOV.UK and MoneyHelper guidance: ingestion, retrieval, evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
ukmoney-ingest = "ukmoney_rag.ingest:main"
ukmoney-serve = "ukmoney_rag.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ukmoney_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = ["network: hits the live internet (run with: pytest -m network)"]
# Upstream deprecation inside fastapi.testclient (not our code); remove once FastAPI updates.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:Warning"]

[tool.coverage.run]
source = ["ukmoney_rag"]
branch = true
