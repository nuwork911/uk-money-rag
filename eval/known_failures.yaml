# Failures observed before the eval harness exists. Each becomes a test case in Week 3.
# Rule: don't fix what you can't measure. Log now, fix in Week 3/4 with a before/after number.
- id: stale-previous-tax-years
  found: 2026-10 (BM25, Week 1)
  query: "what is the higher rate of income tax"
  failure: "Top results include 'previous tax years' pages alongside current rates."
  expected: "Current-year rates page ranked first; previous-years pages below it or filtered."
  retrievers_affected: [bm25]   # check dense once the index is built; update this list
  hypothesis: >
    Not a lexical-vs-semantic problem: historical pages are near-duplicates of current ones, so
    dense retrieval is likely to rank them close too. Candidate fixes: tag chunks with
    is_historical at ingest (title/section match), then filter or demote at query time.

- id: tiny-chunks
  found: 2026-10 (corpus expansion to 49 guides, Week 2)
  query: "how do I pay back a benefit overpayment"
  failure: >
    24 of 803 chunks are under 40 words (min 8). Two kinds: tails of split sections, and
    boilerplate repeated across guides (the overpayment line appears in both Universal Credit
    and Housing Benefit). Short texts give vague embeddings and may outrank substantive chunks.
  expected: "Substantive chunks rank above one-line boilerplate on the same topic."
  retrievers_affected: [unknown]   # measure for bm25 and dense in Week 3/4
  hypothesis: >
    Merge sub-40-word tails into the previous chunk of the same section, and dedupe exact
    boilerplate across documents. Change the chunker only if eval shows measurable harm.

- id: coarse-updated-at
  found: 2026-10 (corpus expansion, Week 2)
  query: "how much is statutory sick pay"
  failure: >
    updated_at is years old for several guides (statutory-sick-pay 2015-03-09,
    national-insurance 2014-12-15, workplace-pensions 2015-01-26) although their rates and
    rules have changed since. GOV.UK guides carry no change_history, and public_updated_at
    only moves on major updates.
  expected: "API and README describe the field as 'last major update', never 'last updated'."
  retrievers_affected: []   # labelling issue, not ranking
  hypothesis: >
    Document or rename the field in the API schema (Week 2 step 3). fetched_at is the honest
    'as of' date for the snapshot; never present updated_at as a freshness guarantee.
