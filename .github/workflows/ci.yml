name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
  workflow_call:   # deploy.yml runs this first and only deploys if it passes

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=85
