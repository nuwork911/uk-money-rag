name: deploy
on:
  # Manual only: each deploy spends trial credit, so it is a deliberate action.
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never kill a deploy halfway

permissions:
  contents: read
  id-token: write   # lets GitHub mint an OIDC token for Workload Identity Federation (no stored keys)

env:
  REGION: europe-west2   # London
  SERVICE: ukmoney-rag
  IMAGE: europe-west2-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ukmoney/ukmoney-rag:${{ github.sha }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml   # includes the offline docker smoke test

  deploy:
    needs: ci
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      # No ingest here: the image is built from the committed, SHA-pinned
      # data/snapshot, so a deploy never depends on what GOV.UK serves that day.

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      - uses: docker/login-action@v4
        with:
          registry: europe-west2-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push image
        run: |
          docker build --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE" .
          docker push "$IMAGE"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.GCP_RUNTIME_SA }}
            --min-instances=0
            --max-instances=2
            --concurrency=40
            --cpu=1
            --memory=1Gi
            --cpu-boost
            --timeout=30s

      - name: Smoke test the live revision
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          health=$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "$URL/health")
          echo "$health" | jq .
          # The live revision must be the image we just built, with dense enabled.
          echo "$health" | jq -e --arg sha "$GITHUB_SHA" '.git_sha == $sha' > /dev/null
          echo "$health" | jq -e 'any(.retrievers[]; . == "dense")' > /dev/null
          for mode in bm25 dense; do
            curl --fail --silent --show-error "$URL/search?q=state+pension&k=1&mode=$mode" \
              | jq -e '.results | length == 1' > /dev/null
            echo "search mode=$mode OK"
          done
          echo "Live at $URL (git $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
