name: deploy
on:
  # Auto-deploy on push is disabled until GCP + Workload Identity are set up (docs/DEPLOY.md).
#   push:
#     branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never kill a deploy halfway

permissions:
  contents: read
  id-token: write   # lets GitHub mint an OIDC token for Workload Identity Federation (no stored keys)

env:
  REGION: europe-west2   # London
  SERVICE: ukmoney-rag
  IMAGE: europe-west2-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ukmoney/ukmoney-rag:${{ github.sha }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Build corpus from GOV.UK
        run: |
          pip install --require-hashes -r requirements.lock && pip install --no-deps .
          python -m ukmoney_rag.ingest --sources configs/sources.toml \
            --user-agent "ukmoney-rag/0.1 (+https://github.com/${{ github.repository }})"
          cat data/processed/manifest.json

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      - uses: docker/login-action@v4
        with:
          registry: europe-west2-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push image
        run: |
          docker build --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE" .
          docker push "$IMAGE"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.GCP_RUNTIME_SA }}
            --min-instances=0
            --max-instances=2
            --concurrency=40
            --cpu=1
            --memory=512Mi
            --timeout=30s

      - name: Smoke test the live revision
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "${{ steps.deploy.outputs.url }}/health"
          curl --fail --silent --show-error \
            "${{ steps.deploy.outputs.url }}/search?q=state+pension&k=1" > /dev/null
          echo "Live at ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
