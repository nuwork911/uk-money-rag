# Retrieval eval set. Protocol and labelling rules: eval/README.md.
# Labels are pinned to the snapshot in eval/CORPUS_SHA256; `make eval-validate` resolves every
# quote against it. Changing this file changes its sha256, so old results stop being comparable.
#
# Tag vocabulary (keep it small):
#   topic:     benefits | tax | pensions | savings | debt | work
#   wording:   lexical (shares key terms with the page) | paraphrase (user's own words)
#   origin:    seed (written by looking at the corpus; may favour BM25) | blind (written first)
#   known-failure (from eval/known_failures.toml)

# --- seed cases --------------------------------------------------------------------------------

[[case]]
id = "income-tax-higher-rate"
question = "what is the higher rate of income tax"
tags = ["tax", "lexical", "seed", "known-failure"]
notes = "Current-year table must beat 'previous tax years' and Capital Gains Tax 'higher rate'."
[[case.evidence]]
url = "https://www.gov.uk/income-tax-rates/current-rates-and-allowances"
quote = "Higher rate | £50,271 to £125,140 | 40%"

